name: Publish package

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  test-testpypi-install:
    name: Test install from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Read package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path("pyproject.toml").read_text()
          match = re.search(r'^version = "([^"]+)"$', text, re.MULTILINE)
          if not match:
              raise RuntimeError("Could not find package version in pyproject.toml")
          print(f"version={match.group(1)}")
          PY

      - name: Install from TestPyPI
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3 4 5; do
            python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "spatialfusion==${{ steps.version.outputs.version }}" && break
            sleep 30
          done

      - name: Smoke test installed package
        run: |
          python - <<'PY'
          import importlib.metadata
          import importlib.resources
          import spatialfusion

          version = importlib.metadata.version("spatialfusion")
          assert version == "${{ steps.version.outputs.version }}"

          root = importlib.resources.files("spatialfusion")
          assert (root / "data" / "checkpoint_dir_ae").is_dir()
          assert (root / "data" / "checkpoint_dir_gcn").is_dir()
          PY

  publish-pypi:
    name: Publish to PyPI
    needs: test-testpypi-install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
